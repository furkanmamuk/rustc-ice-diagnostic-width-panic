name: ICE reproduction

on: [push]

jobs:
  ice-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0

      - name: "rustc 1.94.0 --diagnostic-width=0 (should ICE)"
        run: |
          rustc +1.94.0 --edition=2021 --crate-type lib --diagnostic-width=0 src/lib.rs --out-dir /tmp/out 2>&1
          echo "exit: $?"

      - name: "rustc 1.93.0 --diagnostic-width=0 (should be OK)"
        if: always()
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustc +1.93.0 --edition=2021 --crate-type lib --diagnostic-width=0 src/lib.rs --out-dir /tmp/out 2>&1
          echo "exit: $?"

      - name: "Width threshold sweep"
        if: always()
        run: |
          for w in 0 5 10 11 15 80; do
            echo "=== --diagnostic-width=$w ==="
            rustc +1.94.0 --edition=2021 --crate-type lib --diagnostic-width=$w src/lib.rs --out-dir /tmp/out 2>&1 && echo "OK" || echo "ICE (exit $?)"
            echo
          done
