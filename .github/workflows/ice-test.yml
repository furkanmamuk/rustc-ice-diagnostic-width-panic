name: ICE reproduction

on: [push]

jobs:
  # Pinpoint: which versions ICE?
  version-bisect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.85.0", "1.86.0", "1.87.0", "1.88.0", "1.89.0", "1.90.0", "1.91.0", "1.92.0", "1.93.0", "1.94.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Install rustc ${{ matrix.version }}
        run: rustup toolchain install ${{ matrix.version }} --profile minimal
      - name: "rustc ${{ matrix.version }} --diagnostic-width=0"
        run: |
          rustc +${{ matrix.version }} --edition=2021 --crate-type lib --diagnostic-width=0 src/lib.rs --out-dir /tmp/out 2>&1

  # Pinpoint: which widths ICE?
  width-threshold:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: [0, 1, 5, 8, 9, 10, 11, 15, 20, 80]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: "rustc 1.94.0 --diagnostic-width=${{ matrix.width }}"
        run: |
          rustc +1.94.0 --edition=2021 --crate-type lib --diagnostic-width=${{ matrix.width }} src/lib.rs --out-dir /tmp/out 2>&1
